[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
version = "0.1.0"
description = "Intelligent research paper analysis with Advanced RAG and LangGraph orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# Lower bounds only here; exact resolved versions are pinned in requirements/lock.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "qdrant-client>=1.12",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    # torch is pulled in by sentence-transformers. On CPU-only machines install it first from
    # https://download.pytorch.org/whl/cpu to avoid the much larger CUDA build.
    "sentence-transformers>=3.0",
    "celery[redis]>=5.4",
    "snowballstemmer>=2.2",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx2>=2.14",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.cache/pytest"
markers = [
    "postgres: requires a real PostgreSQL (set TEST_DATABASE_URL)",
    "live: calls real external services (LLM APIs, LangSmith); opt-in only",
    "model: downloads and runs real ML models; opt-in (RUN_MODEL_TESTS=1)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated code; reviewed by hand, not reformatted.
"migrations/versions/*" = ["E501", "UP", "I", "W291"]
