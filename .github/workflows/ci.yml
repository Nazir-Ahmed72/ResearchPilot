name: CI

# Lint, test and build on every push and pull request. No paid APIs are called: the test suite
# uses SQLite, in-memory Qdrant and fakes for every model and LLM, and opt-in live/model suites
# stay skipped (their environment flags are not set here).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt
      - name: Install (CPU-only PyTorch, versions constrained by the lock file)
        run: |
          grep -v -E '^\s*(#|--)' requirements/lock.txt > constraints.txt
          pip install --index-url "$TORCH_INDEX" "$(grep -E '^torch==' constraints.txt)"
          pip install --extra-index-url "$TORCH_INDEX" -c constraints.txt -e ".[dev]"
      # pyproject.toml sets --basetemp=.cache/pytest; pytest creates only the last folder, and
      # .cache/ is git-ignored, so it does not exist in a fresh checkout.
      - name: Create local cache folder
        run: mkdir -p .cache
      - name: Run tests
        env:
          ENVIRONMENT: test
        run: pytest -q -ra

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate docker-compose.yml
        run: |
          docker compose config -q
          docker compose --profile local-db config -q
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: researchpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (container starts, runs as non-root, serves health and docs)
        run: |
          docker run -d --name rp -p 8000:8000 \
            -e QDRANT_LOCATION=:memory: -e REDIS_URL=redis://127.0.0.1:1/0 \
            researchpilot:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/live
          curl -fsS -o /dev/null http://127.0.0.1:8000/docs
          test "$(docker exec rp id -u)" != "0"
          docker exec rp alembic -c alembic.ini heads
      - name: Container logs
        if: always()
        run: docker logs rp || true
