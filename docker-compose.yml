# ResearchPilot local stack.
#
#   docker compose up -d --build          # API on http://localhost:8000/docs
#   docker compose logs -f api worker
#   docker compose down                   # keep data volumes;  add -v to delete them
#
# Services: api, worker (Celery: ingestion + research + evaluation), redis, qdrant, and a
# one-off `migrate` job that applies Alembic migrations before the API and worker start.
#
# Database: PostgreSQL is managed (Neon) and comes from DATABASE_URL / DATABASE_URL_UNPOOLED in
# .env. For a fully offline stack, start the optional PostgreSQL container and point the app at it:
#   COMPOSE_DATABASE_URL=postgresql+psycopg://researchpilot:researchpilot@postgres:5432/researchpilot \
#   docker compose --profile local-db up -d --build
#
# Redis and Qdrant default to the containers below even if .env points to Upstash / Qdrant Cloud;
# set COMPOSE_REDIS_URL / COMPOSE_QDRANT_LOCATION to use the cloud services instead.

name: researchpilot

x-app: &app
  build:
    context: .
  image: researchpilot:local
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
    QDRANT_LOCATION: ${COMPOSE_QDRANT_LOCATION:-http://qdrant:6333}
    QDRANT_API_KEY: ${COMPOSE_QDRANT_API_KEY:-}
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-${DATABASE_URL:-sqlite:///./data/researchpilot.db}}
    DATABASE_URL_UNPOOLED: ${COMPOSE_DATABASE_URL:-${DATABASE_URL_UNPOOLED:-}}
    TASK_BACKEND: celery
    LOG_JSON: "true"
    TEMP_DIR: /tmp
  volumes:
    - app-data:/app/data          # uploaded PDFs, shared by api and worker
    - hf-cache:/app/.cache/hf     # downloaded models, survive rebuilds
  networks: [backend]
  restart: unless-stopped

x-app-depends: &app-depends
  redis:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
    required: false              # only exists with --profile local-db

services:
  api:
    <<: *app
    depends_on: *app-depends
    ports:
      - "${API_PORT:-8000}:8000"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 3g             # embedding model + reranker for /retrieval/search

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -Q
      - ingestion,research
      - --concurrency=1
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 120s         # first start loads (and may download) the models
      retries: 3
    # Warm shutdown: let the current task finish. Unfinished tasks are redelivered (acks_late)
    # and research runs resume from their LangGraph checkpoint.
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 4g

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      disable: true

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.20.1
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      # The image has no curl/wget; open a TCP connection with bash instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18.7-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: researchpilot
      POSTGRES_DB: researchpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchpilot -d researchpilot"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  hf-cache:
  redis-data:
  qdrant-data:
  postgres-data:

networks:
  backend:
